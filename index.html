<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiên hà của chúng mình</title>
<style>
:root{--bg:#05030a;--fg:#fff;--muted:#c4b2d6;--pink:#ff8fb1;--card:#150b1f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05030a}}
:root[data-theme="dark"]{--bg:#05030a}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 55%,#1a0b2e 0%,#05030a 70%);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;touch-action:none}
button{font:inherit;border:0;border-radius:99px;padding:11px 20px;background:linear-gradient(135deg,#ff8fb1,#ff5e8e);color:#2a0a17;font-weight:700;cursor:pointer;margin:4px;box-shadow:0 4px 20px #ff5e8e66}
#only{position:fixed;top:12%;width:100%;text-align:center;font-size:clamp(20px,5.6vw,34px);padding:0 16px;box-sizing:border-box;line-height:1.3;font-weight:700;letter-spacing:.02em;z-index:3;opacity:0;transition:opacity 2.5s;pointer-events:none;color:#fff2f7;text-shadow:0 0 6px #ffd0e0aa,0 0 20px #ff7aa6,0 0 44px #ff3c6ecc,0 0 90px #ff2d5577}
.on{opacity:1!important}
#mus,#rot{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4;width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:18px;background:#ffffff22;color:#fff;box-shadow:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity 2s}
#rot{right:68px}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.62) 100%)}
#only::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;padding:0 16px;box-sizing:border-box;color:#ff3c6e;text-shadow:none;filter:blur(11px);opacity:.25;z-index:-1;pointer-events:none;animation:glowPulse 5.2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.2}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){#only::after{animation:none;opacity:.5}}
#zoom{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:rgba(5,3,10,.9);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;touch-action:none;cursor:zoom-out}
#zoom.show{opacity:1;visibility:visible}
#zc{position:static;inset:auto;display:block;border-radius:14px;box-shadow:0 0 30px #ff5e8e99,0 0 90px #ff2d5566;transform:scale(.35);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
#zoom.show #zc{transform:scale(1)}
#zx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:18px;background:#ffffff22;color:#fff;box-shadow:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#intro{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);touch-action:none;transition:opacity 1.6s,visibility 1.6s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#il{max-width:20em;padding:0 24px;box-sizing:border-box;text-align:center;font-size:clamp(20px,5.4vw,30px);line-height:1.5;font-weight:600;letter-spacing:.02em;color:#fff2f7;text-shadow:0 0 6px #ffd0e0aa,0 0 22px #ff7aa6,0 0 48px #ff3c6ecc;opacity:0;transition:opacity .9s}
#il.big{max-width:none;font-size:clamp(28px,8.4vw,48px);line-height:1.25;font-weight:700;text-shadow:0 0 6px #ffd0e0aa,0 0 20px #ff7aa6,0 0 44px #ff3c6ecc,0 0 90px #ff2d5577}
#gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;font-size:clamp(18px,4.8vw,24px);font-weight:600;color:#fff2f7;text-shadow:0 0 16px #ff7aa6;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}
#gate.on{visibility:visible}
#gate i{width:14px;height:14px;border-radius:50%;background:#ff8fb1;box-shadow:0 0 14px #ff5e8e,0 0 40px #ff3c6e;animation:glowPulse 2.4s ease-in-out infinite}
#gate small{font-size:.68em;font-weight:400;color:var(--muted);text-shadow:none}
#isk{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);margin:0;padding:8px 18px;font-size:14px;font-weight:400;background:none;color:var(--muted);box-shadow:none;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}
#isk.on{visibility:visible}
#mus:not(.on),#rot:not(.on){pointer-events:none}
@media (prefers-reduced-motion:reduce){#gate i{animation:none}}
</style>
</head>
<body>
<div id="vig"></div>
<div id="intro"><div id="il"></div><div id="gate" role="button" tabindex="0"><i></i>Chạm để bắt đầu<small>Hãy bật âm lượng nhé</small></div><button id="isk">Bỏ qua</button></div>
<div id="only">Hẹn Gặp Lại Vào Mùa Hè 2027</div>
<button id="mus" aria-label="Bật hoặc tắt nhạc">🔇</button>
<button id="rot" aria-label="Ngừng xoay" title="Ngừng xoay">🔄</button>
<div id="zoom"><canvas id="zc"></canvas><button id="zx" aria-label="Đóng">✕</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
